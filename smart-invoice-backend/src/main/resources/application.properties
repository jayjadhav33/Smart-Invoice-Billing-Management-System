spring.application.name=smart-invoice
server.port=${PORT:8080}

# ================================
# MySQL Database
# ================================
spring.datasource.url=jdbc:mysql://localhost:3306/smart_invoice_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123B1F033
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ================================
# JPA / Hibernate
